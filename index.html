};

  hotel: "hospedagem",
  ticket: "ingresso",
  transit: "deslocamento",
  activity: "atividade"
};

/* ============================================================
   2. CARREGAR DADOS DA PLANILHA (se configurada)
   Espera colunas: day_label, day_date, day_theme, type, time,
   title, sub, origin, destination
   Uma linha com type "reminder" vira um lembrete do dia (usa
   só a coluna "title" para o texto).
   ============================================================ */
function parseCsv(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); field = "";
        if (row.some(v => v.trim() !== "")) rows.push(row);
        row = [];
      } else field += c;
    }
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  const headers = rows.shift().map(h => h.trim());
  return rows.map(r => Object.fromEntries(headers.map((h, i) => [h, (r[i] || "").trim()])));
}

function buildTripFromRows(rows) {
  const days = [];
  const byLabel = new Map();
  for (const r of rows) {
    if (!r.day_label) continue;
    let day = byLabel.get(r.day_label);
    if (!day) {
      day = { label: r.day_label, date: r.day_date, theme: r.day_theme, items: [], reminders: [] };
      byLabel.set(r.day_label, day);
      days.push(day);
    }
    if (r.type === "reminder") {
      if (r.title) day.reminders.push({ text: r.title, link: r.link || "" });
    } else if (r.type) {
      day.items.push({ type: r.type, time: r.time || "", title: r.title || "", sub: r.sub || "", origin: r.origin || "", destination: r.destination || "", link: r.link || "", link2: r.link2 || "", link2Label: r.link2_label || "Link" });
    }
  }
  return {
    clientName: rows[0]?.client_name || TRIP_FALLBACK.clientName,
    title: TRIP_FALLBACK.title,
    dateRange: days.length ? `${days[0].date} a ${days[days.length - 1].date}` : TRIP_FALLBACK.dateRange,
    days
  };
}

async function loadTrip() {
  if (!CONFIG.SHEET_CSV_URL) return TRIP_FALLBACK;
  try {
    const res = await fetch(CONFIG.SHEET_CSV_URL);
    if (!res.ok) throw new Error("Falha ao buscar planilha");
    const rows = parseCsv(await res.text());
    return buildTripFromRows(rows);
  } catch (err) {
    console.error("Não foi possível carregar a planilha, usando dados de exemplo.", err);
    return TRIP_FALLBACK;
  }
}

/* ============================================================
   3. TEMPO DE DESLOCAMENTO (opcional)
   Se TRAVEL_TIME_FUNCTION_URL estiver configurada, busca o tempo
   real via Google Maps para itens do tipo "transit" que tenham
   origin/destination preenchidos na planilha.
   ============================================================ */
async function enrichTravelTimes(trip) {
  if (!CONFIG.TRAVEL_TIME_FUNCTION_URL) return trip;
  for (const day of trip.days) {
    for (const it of day.items) {
      if (it.type === "transit" && it.origin && it.destination) {
        try {
          const url = `${CONFIG.TRAVEL_TIME_FUNCTION_URL}?origin=${encodeURIComponent(it.origin)}&destination=${encodeURIComponent(it.destination)}`;
          const res = await fetch(url);
          const data = await res.json();
          if (data.durationText) it.sub = `${it.sub ? it.sub + " · " : ""}${data.durationText} de trajeto agora`;
        } catch (err) {
          console.error("Não foi possível calcular o deslocamento", err);
        }
      }
    }
  }
  return trip;
}

function itemRow(it) {
  const titleHtml = it.link
    ? `<a href="${it.link}" target="_blank" rel="noopener noreferrer" class="row-title row-title--link">${it.title} <span class="row-link-icon" aria-hidden="true">↗</span></a>`
    : `<p class="row-title">${it.title}</p>`;
  const link2Html = it.link2
    ? `<a href="${it.link2}" target="_blank" rel="noopener noreferrer" class="row-link2">${it.link2Label} <span class="row-link-icon" aria-hidden="true">↗</span></a>`
    : "";
  return `
    <div class="row">
      <div class="row-time">${it.time}</div>
      <div class="row-icon row-icon--${it.type}" aria-hidden="true">${ICONS[it.type] || "•"}</div>
      <div class="row-body">
        <div class="row-top">
          ${titleHtml}
          <span class="row-tag">${LABELS[it.type]}</span>
        </div>
        <p class="row-sub">${it.sub}</p>
        ${link2Html}
      </div>
    </div>`;
}

function reminderRow(reminder) {
  const textHtml = reminder.link
    ? `<a href="${reminder.link}" target="_blank" rel="noopener noreferrer" class="reminder-link">${reminder.text} <span class="row-link-icon" aria-hidden="true">↗</span></a>`
    : reminder.text;
  return `
    <div class="reminder">
      <span aria-hidden="true">🔔</span>
      <p>${textHtml}</p>
    </div>`;
}

function isUniversalDay(day) {
  const text = [day.theme, ...day.items.map(it => `${it.title} ${it.sub} ${it.origin} ${it.destination}`)].join(" ").toLowerCase();
  return text.includes("universal");
}

function render() {
  const app = document.getElementById('app');
  const tabs = TRIP.days.map((d, i) => `
    <button class="tab ${i === activeDay ? 'tab--active' : ''}" data-idx="${i}" aria-pressed="${i === activeDay}">
      <span class="tab-label">${d.label}</span>
      <span class="tab-theme">${d.theme}</span>
    </button>`).join('');

  const day = TRIP.days[activeDay];
  document.body.classList.toggle('theme-universal', isUniversalDay(day));
  const items = day.items.map(itemRow).join('');
  const reminders = day.reminders.map(reminderRow).join('');

  app.innerHTML = `
    <header class="header">
      <p class="eyebrow">${TRIP.title}</p>
      <h1>${TRIP.clientName}</h1>
      <p class="dates">${TRIP.dateRange}</p>
    </header>

    <nav class="tabs" role="tablist" aria-label="Dias da viagem">${tabs}</nav>

    <main class="card">
      <div class="card-head">
        <div>
          <p class="card-theme">${day.theme}</p>
          <p class="card-date">${day.date}</p>
        </div>
        <div class="stub">${day.label}</div>
      </div>
      <div class="timeline">${items}</div>
      <div class="reminders">
        <p class="reminders-title">🔔 Lembretes de hoje</p>
        ${reminders}
      </div>
    </main>
  `;

  app.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      activeDay = parseInt(btn.dataset.idx, 10);
      render();
    });
  });
}

(async function init() {
  document.getElementById('app').innerHTML = '<p style="color:#9FB3C4;font-family:Inter,sans-serif;padding:32px 20px">Carregando roteiro…</p>';
  TRIP = await loadTrip();
  TRIP = await enrichTravelTimes(TRIP);
  render();
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => console.error("Service worker falhou", err));
  });
}
